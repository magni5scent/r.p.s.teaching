<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <section class="game">
      <img class="" rps src="images/rock.jpeg" alt="rock paper scissors" />
      <p>
        First to 5 points wins!
        <button class="btn--show-modal">HINT</button>
      </p>

      <div class="modal hidden">
        <button class="btn--close-modal">&times;</button>

        <p class="modal-para">
          The rules are simple: ROCK beats SCISSORS, SCISSORS beat PAPER, and
          PAPER beats ROCK. Have fun😀!
        </p>
      </div>
      <div class="overlay hidden"></div>

      <div class="movesLeft">MOVES: 0</div>

      <div class="container">
        BEST RECORD --- 5
        <div class="rec">PERSONAL BEST --- 0</div>
      </div>

      <div class="gamepot">
        <div id="playerPot">PLAYER:</div>
        <span class="playerScore">0</span>

        <div id="computerPot">COMPUTER:</div>
        <span class="computerScore">0</span>

      </div>
      <div id="resultPot"></div>

      <div class="gamer">
        <img class="options" class="rock" src="images/rock.JPG" alt="rock" />
        <img class="options" class="paper" src="images/paper.JPG" alt="paper" />
        <img
          class="options"
          class="scissors"
          src="images/scissor.JPG"
          alt="scissors"
        />
      </div>
    </section>
  </body>
</html>
