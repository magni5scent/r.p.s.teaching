<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <section class="game">
      <h1 class="title">Rock Paper Scissors.</h1>
      <p>Beat the computer to 5 points or you lose!</p>
      <p>
       BEST RECORD ---
        <span class="recordMove">5</span>
        <div class="rec">PERSONAL BEST: 0</div>
      </p>

      <div class="gamepot">
        <div id="playerPot">PLAYER: </div>
        <span class="playerScore">0</span>
        
        <div id="computerPot">COMPUTER:</div> <span class="computerScore">0</span>
     
        <div id="resultPot"> </div>
      </div>

      <div class="gamer">
        <button class="options">Rock</button>
        <button class="options">Paper</button>
        <button class="options">Scissors</button>
      </div>

      <div class="movesLeft">MOVES: 0</div>

      <!-- <button id="restart">Restart</button> -->
    </section>
  </body>
</html>
